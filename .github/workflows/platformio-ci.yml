name: Compilar firmware ESP32

on:
  push:
    branches: [main]
  pull_request:

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar PlatformIO
        run: pip install platformio
      - name: Compilar firmware
        run: pio run
